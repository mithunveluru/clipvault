name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build qt6-base-dev qt6-base-dev-tools \
            libqt6sql6-sqlite libgl1-mesa-dev \
            xvfb xauth dbus strace libxcb-cursor0 pkg-config libxcb1-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}

      - name: Build
        run: cmake --build build

      - name: Test
        # every suite including the clipboard one and the release gates
        run: xvfb-run -a ctest --test-dir build --output-on-failure

  lint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build qt6-base-dev qt6-base-dev-tools libqt6sql6-sqlite libgl1-mesa-dev pkg-config libxcb1-dev
          python3 -m pip install --user --break-system-packages clang-format==23.1.3 clang-tidy==23.1.4

      - name: Configure and build
        run: cmake -S . -B build -G Ninja && cmake --build build

      - name: Lint new files
        run: tools/lint_new_files.sh origin/${{ github.base_ref }} build

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Attribution check
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          elif [ "${{ github.event.before }}" = 0000000000000000000000000000000000000000 ]; then
            range="HEAD~1..HEAD"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          tools/check_attribution.sh "$range"
          # catches leftover conflict markers and whitespace errors in added lines
          git diff --check "$range"
